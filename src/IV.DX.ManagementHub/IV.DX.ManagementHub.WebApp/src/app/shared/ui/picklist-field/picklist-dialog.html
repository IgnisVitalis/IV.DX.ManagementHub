<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content class="picklist__content">
  <mat-form-field appearance="outline" class="picklist__search">
    <mat-label>Поиск</mat-label>
    <input matInput type="search" [value]="search()" (input)="onSearch($event)" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <mat-nav-list class="picklist__list">
    @if (data.allowNull) {
      <a mat-list-item [activated]="isSelected(null)" (click)="select(null)">
        <span matListItemTitle>—</span>
      </a>
    }

    @if (filtered().length === 0) {
      <p class="picklist__empty">Ничего не найдено</p>
    } @else {
      <cdk-virtual-scroll-viewport [itemSize]="itemSize" class="picklist__viewport">
        <a
          mat-list-item
          *cdkVirtualFor="let option of filtered(); trackBy: trackByValue"
          [activated]="isSelected(option.value)"
          (click)="select(option.value)"
        >
          <span matListItemTitle>{{ option.label }}</span>
        </a>
      </cdk-virtual-scroll-viewport>
    }
  </mat-nav-list>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Отмена</button>
</mat-dialog-actions>
