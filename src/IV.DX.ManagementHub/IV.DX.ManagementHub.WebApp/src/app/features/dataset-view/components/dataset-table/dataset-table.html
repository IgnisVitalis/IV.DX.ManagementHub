<div class="dataset-table__scroll">
  <table mat-table [dataSource]="sortedRows()" matSort (matSortChange)="sort.set($event)">
    <ng-container [matColumnDef]="selectColumn">
      <th mat-header-cell *matHeaderCellDef class="dataset-table__select-cell">
        <mat-checkbox
          [checked]="allSelected()"
          [indeterminate]="someSelected()"
          (change)="toggleAll()"
          aria-label="Выбрать все строки"
        />
      </th>
      <td mat-cell *matCellDef="let row" class="dataset-table__select-cell">
        <!-- The row click already toggles selection; letting the checkbox bubble
             would toggle it twice and leave the state inverted. -->
        <mat-checkbox
          (click)="$event.stopPropagation()"
          [checked]="isSelected(row)"
          (change)="select(row)"
          aria-label="Выбрать строку"
        />
      </td>
    </ng-container>

    @for (column of columns(); track column.name) {
      <ng-container [matColumnDef]="column.name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ column.name }}</th>
        <td mat-cell *matCellDef="let row">{{ row.display[column.name] }}</td>
      </ng-container>
    }

    @if (hasActions()) {
      <ng-container [matColumnDef]="actionsColumn" stickyEnd>
        <th mat-header-cell *matHeaderCellDef class="dataset-table__actions-cell"></th>
        <td mat-cell *matCellDef="let row" class="dataset-table__actions-cell">
          <!-- The click must not reach the row, or acting on a row would also select it. -->
          <mh-unit-actions
            (click)="$event.stopPropagation()"
            [typeName]="typeName()"
            [ids]="[row.id]"
            [canEdit]="canEdit()"
            [canDelete]="canDelete()"
            [canExport]="canExport()"
            (changed)="changed.emit()"
            (deleted)="deleted.emit($event)"
            (failed)="failed.emit($event)"
          />
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns(); sticky: true"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns()"
      class="dataset-table__row"
      [class.dataset-table__row--selected]="isSelected(row)"
      [attr.aria-selected]="isSelected(row)"
      (click)="select(row)"
    ></tr>
  </table>
</div>
